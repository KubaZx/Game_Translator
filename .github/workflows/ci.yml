name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Grupa współdzielona TYLKO przez przebiegi tego samego PR-a: nowy push do PR-a
# anuluje poprzedni, bo jego wynik i tak nikogo już nie interesuje. Push na main,
# tagi v* i workflow_dispatch dostają unikalną grupę (run_id) — gdyby dzieliły
# grupę per ref, GitHub trzymałby tylko jeden oczekujący przebieg i anulował
# starsze oczekujące (commit B przy szybkich pushach A, B, C nie dostałby wyniku,
# a ręcznie uruchomiony publish mógłby zniknąć). Dzięki temu każdy commit na main
# i każde wydanie ma własny, dokończony przebieg, równolegle jak przed zmianą.
# Domyślnie token tylko do odczytu — zapis (wydanie) dostaje jedynie job publish.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Szybka kontrola na Linuksie: kompilacja całego rozwiązania (także WPF dzięki
  # EnableWindowsTargeting) i testy xUnit. Testy DPAPI/OCR wymagają Windows —
  # pełny przebieg robi job build-test poniżej.
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build
        run: dotnet build GameTranslatorOverlay.slnx -c Release -p:EnableWindowsTargeting=true

      # Pokrycie zbiera coverlet.collector (już w projektach testowych); co liczymy,
      # a czego nie (kod generowany, obj/, same testy), ustala tests/coverage.runsettings.
      # Testy DPAPI są tu Skipped ([WindowsFact]) — przechodzą w jobie build-test.
      - name: Test z pokryciem
        run: >
          dotnet test GameTranslatorOverlay.slnx -c Release --no-build
          -p:EnableWindowsTargeting=true
          --collect:"XPlat Code Coverage"
          --settings tests/coverage.runsettings
          --results-directory TestResults

      # ReportGenerator przypięty w .config/dotnet-tools.json, żeby raport wyglądał
      # tak samo lokalnie i w CI. Scala raporty obu projektów testowych (Core jest
      # pokrywany z obu stron) i daje HTML, podsumowanie Markdown i scaloną Coberturę.
      - name: Raport pokrycia
        run: |
          dotnet tool restore
          dotnet tool run reportgenerator \
            "-reports:TestResults/**/coverage.cobertura.xml" \
            "-targetdir:TestResults/coverage-report" \
            "-reporttypes:HtmlInline;MarkdownSummaryGithub;Cobertura"
          cat TestResults/coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: TestResults/coverage-report/

      # Progi kilka punktów poniżej zmierzonych (Core 95,1%, Infrastructure 84,9%
      # przy wprowadzeniu) — łapią wyraźny spadek, nie ułamki procenta.
      - name: Próg pokrycia
        run: >
          python3 tools/check-coverage.py TestResults/coverage-report/Cobertura.xml
          GameTranslatorOverlay.Core=91
          GameTranslatorOverlay.Infrastructure=80

      # Narzędzie ewaluacji dostawców na przykładowym korpusie, z atrapą Mock: bez kluczy
      # i bez sieci. Sprawdza, że korpus, pipeline i raport działają od początku do końca.
      - name: ProviderEval (Mock)
        run: >
          dotnet run --project tools/GameTranslatorOverlay.ProviderEval -c Release --no-build --
          --corpus eval/en-pl.sample.jsonl --providers mock --out eval/out

  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      # Testy używają wyłącznie MockTranslationProvider i fałszywego HTTP —
      # zero sekretów, zero prawdziwych kluczy API.
      - name: Test
        run: dotnet test -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build-test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Artefakt musi być identyczny z paczką z tools/package.ps1: embedded PDB
      # (osobne PDB-y zawierają lokalne ścieżki dewelopera), komplet dokumentów i licencji.
      - name: Publish portable win-x64
        run: >
          dotnet publish src/GameTranslatorOverlay.App -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=embedded
          -o publish

      - name: Strip stray PDBs and bundle docs
        shell: pwsh
        run: |
          Get-ChildItem publish -Filter *.pdb | Remove-Item -Force
          Copy-Item README.md, THIRD-PARTY-NOTICES.md, CHANGELOG.md -Destination publish -Force
          Copy-Item docs/USER_GUIDE.md, docs/PRIVACY.md, docs/SECURITY.md -Destination publish -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameTranslatorOverlay-win-x64
          path: publish/

      # Tag v* = pełne wydanie: zip identyczny z tools/package.ps1 + GitHub Release.
      - name: Pack release zip
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath "GameTranslatorOverlay-$env:GITHUB_REF_NAME-win-x64.zip"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: GameTranslatorOverlay ${{ github.ref_name }}
          files: GameTranslatorOverlay-*.zip
          body: |
            Portable win-x64 (self-contained, bez instalacji). Rozpakuj zip i uruchom `GameTranslatorOverlay.exe`.

            Pełna lista zmian: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md)
